 Data is Stored\",\"storageText\":\"All data is stored in your browser's localStorage — a small storage space on YOUR device. We never see it, we can't access it, and it never leaves your computer or phone. When you clear your browser data, it's gone forever.\",\"ttsTitle\":\"Voice Read-Aloud Feature\",\"ttsText\":\"If you enable the \\\"read aloud\\\" feature, the story text may be sent to a text-to-speech service (Azure or your device's built-in voice) to generate audio. Only the story text is sent — never any personal information. This feature is optional and can be disabled.\",\"dontTitle\":\"What We Don't Do\",\"dontItems\":[\"We don't collect email addresses\",\"We don't require accounts or passwords\",\"We don't use cookies for tracking\",\"We don't show advertisements\",\"We don't share or sell any data\",\"We don't use analytics or tracking tools\"],\"childrenTitle\":\"Children's Privacy (COPPA)\",\"childrenText\":\"JamboScript is designed for children aged 8–14. We take children's privacy very seriously. We don't collect any personal information from children. The only data stored is on the child's own device and is fully under parental control.\",\"deleteTitle\":\"Delete All Data\",\"deleteText\":\"To erase all JamboScript data from your device, open your browser's developer tools (F12) and run this command:\",\"disclaimerTitle\":\"Disclaimer\",\"disclaimerText\":\"JamboScript is provided \\\"as is\\\" for educational purposes only. We make no warranties regarding the accuracy or completeness of the content. We are not responsible for any issues arising from the use of this platform. Parents and guardians are responsible for supervising their children's use of this site.\",\"contactTitle\":\"Questions?\",\"contactText\":\"If you have any questions about privacy, please contact us at\",\"backButton\":\"Back to Parents Page\"},\"TopBar\":{\"map\":\"Map\",\"story\":\"Story\",\"settings\":\"Settings\",\"chapterOf\":\"Chapter {number} / {total}\",\"muteSound\":\"Mute sound \u0026 music\",\"enableSound\":\"Enable sound \u0026 music\",\"muteNarration\":\"Stop read-aloud\",\"enableNarration\":\"Read aloud\"},\"Editor\":{\"run\":\"Run\",\"running\":\"Running...\",\"success\":\"✅ Success\",\"output\":\"Output\",\"outputError\":\"Output\",\"noOutput\":\"No output\",\"printToScreen\":\"Say something\",\"condition\":\"Make a choice (if)\",\"loop\":\"Repeat (loop)\",\"functionSnippet\":\"Make a recipe\"},\"Challenge\":{\"hints\":\"Hints\",\"hintLabel\":\"Hint {number}\",\"free\":\"(free)\",\"congratulations\":\"🎉 Congratulations! You did it!\"},\"Celebrations\":{\"congratulations\":\"Congratulations!\",\"completed\":\"You completed \\\"{title}\\\"\",\"nextChapter\":\"Next Chapter →\",\"playAgain\":\"Play Again\"},\"Speakers\":{\"kito\":\"Kito\",\"mzee_byte\":\"Mzee Byte\",\"shida\":\"Shida\",\"narrator\":\"Narrator\"},\"Scenes\":{\"gateLocked\":\"🔒 Village Gate\",\"gateOpened\":\"🔓 Gate is open!\",\"guardWelcome\":\"✅ Welcome!\",\"village\":\"🏠\",\"forest\":\"🌲\",\"bridge\":\"🌉\",\"mountain\":\"⛰️\",\"cave\":\"🕳️\",\"waterfall\":\"💧\",\"garden\":\"🌸\",\"market\":\"🏪\",\"library\":\"📚\",\"celebration\":\"🎉\"},\"LanguageSwitcher\":{\"label\":\"Language\"},\"Chapters\":{\"locale\":\"en\",\"ch1\":{\"title\":\"Say the Magic Words!\",\"subtitle\":\"Tell the computer what to say\",\"questHook\":\"The magic tree is sick! Help Kito open the gate! 🚪\",\"d1\":\"Once upon a time, there was a village called Algoriti. 🏘️ It had an amazing magic tree 🌳 that kept all the village's stories and songs safe. But oh no! A sneaky little bug named Shida is making the tree sick! 😱\",\"d2\":\"Hi! I'm Kito the turtle! 🐢 I need YOUR help to save our magic tree! But first — see this big gate? Shida locked it! 🔒 We need to tell the computer to say the secret words to open it!\",\"d2b\":\"Hehehe! 👾 You can't get in! I locked the gate and threw away the key! Nyah nyah!\",\"d3\":\"Don't worry! I know a trick! ✨ Type \\\"andika\\\" — that's how you tell the computer to TALK! It's like saying \\\"Hey computer, say this!\\\" Try it:\",\"d4\":\"See? andika(\\\"...\\\") makes the computer say whatever is inside the quotes! Put the magic words in and — BOOM! 💥 The lock breaks!\",\"starterCode\":\"# Say the magic words to open the gate!\\n# Just press the ▶ Run button!\\n\\nandika(\\\"Fungua lango!\\\")\\n\",\"task\":\"Press ▶ Run to say the magic words!\",\"riddle\":\"🚪 The gate is locked! Press ▶ Run to make the computer say the magic words!\",\"hint1\":\"Just press the green ▶ Run button!\",\"hint2\":\"The code is already there — andika(\\\"Fungua lango!\\\")\",\"hint3\":\"andika means \\\"say\\\" — it makes the computer talk!\",\"errorGeneric\":\"Oops! Something went wrong — try again! 🔄\",\"errorNoOutput\":\"The gate can't hear you! Press ▶ Run to say something!\",\"ex2\":{\"starterCode\":\"# Now say YOUR OWN magic words!\\n# Change the message to anything you want!\\n\\nandika(\\\"Fungua lango!\\\")\\n\",\"task\":\"Change the message to your own magic words!\",\"riddle\":\"✏️ Kito says: \\\"Now make the computer say YOUR words! Change the message inside the quotes!\\\"\",\"bridge\":\"Amazing! You opened the gate! 🎉 But can you make the computer say YOUR OWN words? Change what's inside the quotes!\",\"hint1\":\"Change \\\"Fungua lango!\\\" to something else, like \\\"Habari!\\\"\",\"hint2\":\"Keep the andika(...) but put YOUR words between the \\\"\\\" marks!\",\"errorNoAndika\":\"You need to use andika() to make the computer talk!\",\"errorSameMessage\":\"Great start! But change the message — type YOUR own words!\",\"errorEmpty\":\"Don't leave it empty! Type something between the quotes!\"},\"ex3\":{\"starterCode\":\"# Say TWO things! Fill in the blank:\\n\\nandika(\\\"Habari!\\\")\\nandika(\\\"___\\\")\\n\",\"task\":\"Make the computer say TWO things!\",\"riddle\":\"📝 Can you make the computer say TWO things? Fill in the blank on line 4!\",\"bridge\":\"You changed the message! 🌟 Now try making the computer say TWO things — like a conversation!\",\"hint1\":\"Replace ___ with any words you like!\",\"hint2\":\"Example: andika(\\\"Habari!\\\") then andika(\\\"Mambo vipi?\\\")\",\"errorNeedTwo\":\"Almost! You need TWO andika lines that both print something!\"},\"ex4\":{\"starterCode\":\"# 🐛 Shida broke the code! Can you fix it?\\n# Something is missing...\\n\\nandika(Fungua lango!)\\n\",\"task\":\"🐛 Shida broke the code! Find and fix the bug!\",\"riddle\":\"🐛 Shida ate something from the code! Compare it to what Kito showed you — what's missing?\",\"bridge\":\"Uh oh! 🐛 Shida snuck in and ate part of the code! Can you spot what's wrong and fix it?\",\"hint1\":\"Compare this code to the working one above — what's different?\",\"hint2\":\"Words need to be wrapped in quote marks \\\"like this\\\"\",\"hint3\":\"Try: andika(\\\"Fungua lango!\\\")\",\"errorNoQuotes\":\"Almost! The words need to be inside quote marks: \\\"...\\\"\",\"hintQuotes\":\"💡 The words need to be inside quote marks — like andika(\\\"Fungua lango!\\\")\"},\"outro1\":\"WOOOOSH! ✨ The gate flies open! Golden light everywhere! The villagers come out cheering — someone is here to save the tree! 🎉\",\"outro2\":\"You did it! 🐢 You just told the computer what to say — that's your FIRST coding spell! But Shida has more tricks up ahead. Let's go! 🏃\"},\"ch2\":{\"title\":\"What's Your Name?\",\"subtitle\":\"Teach the computer to remember things\",\"questHook\":\"The old man at the gate wants to know your name! 👴\",\"d1\":\"You're through the gate! 🎉 But wait — there's an old man blocking the path. He says: \\\"Stop! I don't let strangers through. Tell me your name first!\\\" 👴\",\"d2\":\"Uh oh! He won't let us pass! 🐢 We need to teach the computer YOUR name so everyone knows who you are!\",\"d3\":\"\\\"acha\\\" is like putting something in a box and writing a label on it! 📦 You put your name inside, like this:\",\"d4\":\"\\\"acha jina = ...\\\" means \\\"computer, remember my name!\\\" Then \\\"andika(jina)\\\" means \\\"say it out loud!\\\" — the old man will hear and let you through! 😊\",\"starterCode\":\"# The old man asks: \\\"What's your name?\\\"\\n# Put your name between the quote marks:\\n\\nacha jina = \\\"Your Name\\\"\\n\\n# Now say it out loud:\\nandika(jina)\\n\",\"task\":\"Type your name between the quotes!\",\"riddle\":\"🏠 The old man asks: \\\"Who are you?\\\" — Type your name between the \\\" \\\" marks!\",\"hint1\":\"Change \\\"Your Name\\\" to YOUR real name!\",\"hint2\":\"Like this: acha jina = \\\"Amani\\\"\",\"hint3\":\"Make sure you type at least one letter inside the \\\"\\\"\",\"errorGeneric\":\"Oops! Something went wrong — try again!\",\"errorNoName\":\"You forgot your name! Type it inside the quote marks \\\"\\\"!\",\"ex2\":{\"starterCode\":\"# Now store your AGE too!\\n# Fill in your age number:\\n\\nacha umri = ___\\nandika(umri)\\n\",\"task\":\"Store your age in a variable and print it!\",\"riddle\":\"📦 Put your age in a box! Replace ___ with a number!\",\"bridge\":\"The elder knows your name now! 🎉 But he also wants to know how old you are. Store your age in a box!\",\"hint1\":\"Replace ___ with a number like 10\",\"hint2\":\"Try: acha umri = 10\",\"errorNoAcha\":\"You need to use acha to create a variable!\",\"errorNoUmri\":\"Put a NUMBER (like 10) after umri = !\",\"errorNoOutput\":\"Say your age out loud! Add andika(umri) at the end!\"},\"ex3\":{\"starterCode\":\"# Create TWO boxes and say both!\\n\\n\",\"task\":\"Create two variables and print both of them!\",\"riddle\":\"🚀 Make TWO boxes with acha and say both with andika! You're on your own!\",\"bridge\":\"You're getting good at this! 🌟 Now try making TWO variables all by yourself!\",\"hint1\":\"Start with: acha rangi = \\\"bluu\\\"\",\"hint2\":\"Then add: acha nambari = 7 and andika(nambari)\",\"hint3\":\"Full example: acha rangi = \\\"bluu\\\"\\nandika(rangi)\\nacha nambari = 7\\nandika(nambari)\",\"errorNeedTwo\":\"You need at least TWO acha lines — two boxes!\",\"errorPrintBoth\":\"Don't forget to andika both variables!\"},\"ex4\":{\"starterCode\":\"# 🐛 Shida messed up the variable name!\\n# The andika line has a typo!\\n\\nacha wanyama = \\\"simba\\\"\\nandika(wanayama)\\n\",\"task\":\"🐛 Shida misspelled the variable! Find the typo!\",\"riddle\":\"🐛 Look carefully at line 5 — does the name match the box label?\",\"bridge\":\"Shida is at it again! 🐛 She changed one letter in the code. Can you spot it?\",\"hint1\":\"Compare the name on line 4 and line 5 — are they the same?\",\"hint2\":\"Line 4 says 'wanyama' but line 5 says 'wanayama' — spot the difference!\",\"hint3\":\"Change wanayama to wanyama — the 'y' and 'a' are swapped!\",\"hintSpelling\":\"💡 Check the spelling — the variable name must be EXACTLY the same!\"},\"outro1\":\"The old man smiles! \\\"Welcome, little one!\\\" 😊 Now everyone in the village knows your name! You can keep going toward the magic tree! 🌳\",\"outro2\":\"Psst! 👾 So what if you have a name? I messed up all the signs in the forest! You'll get SO lost! Hehehe!\",\"outro3\":\"Don't listen to Shida! 🐢 The cool thing is — the computer remembers your name now! That's called a \\\"variable\\\" — it's like a label on a box. Super useful! Let's keep going! 📦\"},\"ch3\":{\"title\":\"Choose Your Path!\",\"subtitle\":\"Teach the computer to choose\",\"questHook\":\"Shida mixed up the signs! Which way do we go? 🤔\",\"d1\":\"You're in the forest now! 🌲 The path splits in two! Left goes to a cave 🕳️, right goes to a river 🏞️. It's raining — which one is safe?\",\"d1b\":\"Hahaha! 👾 I switched ALL the signs! Good luck finding the way! Mwahahaha!\",\"d2\":\"Don't be scared! 😊 I'm Mzee Byte, the wise old owl 🧙. We can check the weather and pick the right path!\",\"d3\":\"\\\"kama\\\" means \\\"if\\\" — like asking a question! IF it's raining → go to the cave! Simple! Look:\",\"d4\":\"It's raining right now! 🌧️ So just fill in what to say: \\\"Nenda pangoni!\\\" means \\\"Go to the cave!\\\" Easy peasy!\",\"starterCode\":\"# It's raining! (hewa = \\\"mvua\\\")\\n# Tell everyone to go to the cave!\\n# Just fill in the words inside andika:\\n\\nkama (hewa ni \\\"mvua\\\") {\\n  andika(\\\"___\\\")\\n}\\n\",\"task\":\"Fill in the blank — what should we say when it rains?\",\"riddle\":\"🌧️ It's raining! Fill in the blank: tell everyone where to go!\",\"hint1\":\"Replace ___ with words like \\\"Nenda pangoni!\\\"\",\"hint2\":\"Try: andika(\\\"Nenda pangoni!\\\")\",\"hint3\":\"Any words work! Just type something between the quotes!\",\"errorGeneric\":\"Oops! Something went wrong — try again! 🔄\",\"errorNoOutput\":\"The kama block didn't say anything! Fill in the blank inside andika(\\\"___\\\")\",\"ex2\":{\"starterCode\":\"# What if it's NOT raining? Add \\\"la sivyo\\\" (else)!\\n\\nkama (hewa ni \\\"mvua\\\") {\\n  andika(\\\"Nenda pangoni!\\\")\\n}\\n\",\"task\":\"Add a \\\"la sivyo\\\" block for when it's NOT raining!\",\"riddle\":\"☀️ What do we say if it's sunny? Add la sivyo { ... } after the closing }\",\"bridge\":\"You chose the right path! 🎉 But what if the weather changes? Let's plan for both!\",\"hint1\":\"After the }, add: la sivyo { andika(\\\"something\\\") }\",\"hint2\":\"la sivyo means \\\"otherwise\\\" — it runs when kama is false!\",\"errorNoKama\":\"You need to use kama to make a choice!\",\"errorNoElse\":\"Add la sivyo { ... } to handle the other case!\"},\"ex3\":{\"starterCode\":\"# Write your own kama/la sivyo from scratch!\\n# Create a variable and check it!\\n\\n\",\"task\":\"Write your own if/else from scratch!\",\"riddle\":\"🚀 Create a variable, then use kama to check it! Add la sivyo too!\",\"bridge\":\"Now you know kama AND la sivyo! 🌟 Can you write one all by yourself?\",\"hint1\":\"Start with: acha chakula = \\\"pilau\\\"\",\"hint2\":\"Then: kama (chakula ni \\\"pilau\\\") { andika(\\\"Tamu!\\\") }\",\"hint3\":\"Full example: acha chakula = \\\"pilau\\\"\\nkama (chakula ni \\\"pilau\\\") {\\n  andika(\\\"Tamu!\\\")\\n} la sivyo {\\n  andika(\\\"Sawa tu\\\")\\n}\"},\"ex4\":{\"starterCode\":\"# 🐛 Shida wrote the wrong check!\\n# It IS raining, but the code checks for sun!\\n\\nkama (hewa ni \\\"jua\\\") {\\n  andika(\\\"Nenda pangoni!\\\")\\n}\\n\",\"task\":\"🐛 The condition is wrong! It's raining but the code checks for sun!\",\"riddle\":\"🐛 Look at line 4 — the weather is mvua (rain) but Shida wrote jua (sun)!\",\"bridge\":\"Shida switched the weather check! 🐛 The code looks right but the condition is wrong!\",\"hint1\":\"What's the actual weather? It's mvua (rain), not jua (sun)!\",\"hint2\":\"Change \\\"jua\\\" to \\\"mvua\\\" on line 4\",\"hint3\":\"kama (hewa ni \\\"mvua\\\") — that's the fix!\",\"errorWrongCondition\":\"Check your condition — the weather is mvua, not jua!\",\"hintWrongWeather\":\"💡 The weather is mvua (rain) — change the condition to check for mvua!\"},\"outro1\":\"The right path lights up under your feet! ✨ Shida's fake signs pop like bubbles! The forest opens up and you can see... a big old bridge! 🌉\",\"outro2\":\"Great job! 🧙 You taught the computer to choose — IF something is true, DO something! That's really smart! But there's more ahead...\"},\"ch4\":{\"title\":\"Step by Step!\",\"subtitle\":\"Make the computer repeat things\",\"questHook\":\"Shida broke the bridge! Walk carefully — 5 steps! 🌉\",\"d1\":\"You made it to the bridge! 🌉 The magic tree is RIGHT THERE on the other side! But... Shida chewed through the wood! 😬 Only 5 boards left!\",\"d1b\":\"I ate most of the boards! 👾 Nom nom nom! There's NO WAY you can cross!\",\"d2\":\"Don't panic! 🧙 We'll use a LOOP! Instead of writing \\\"step\\\" five times... we write it ONCE and say \\\"do it 5 times\\\"!\",\"d3\":\"\\\"rudia\\\" means \\\"repeat\\\"! It does something over and over. The number tells it how many times! Watch:\",\"d4\":\"See that number 5? That's how many steps we take! The loop says \\\"do this 5 times\\\" — just press Run! Easy!\",\"starterCode\":\"# Walk across the bridge!\\n# The loop repeats 5 times — one step each time!\\n# Just press ▶ Run!\\n\\nrudia (acha i = 0; i chini 5; i++) {\\n  andika(\\\"Hatua! 🦶\\\")\\n}\\n\",\"task\":\"Press ▶ Run to walk across the bridge!\",\"riddle\":\"🌉 The bridge has 5 boards! Press ▶ Run to take 5 steps across!\",\"hint1\":\"The loop is already there! Just press ▶ Run!\",\"hint2\":\"The number 5 means it repeats 5 times — one step per board!\",\"hint3\":\"Try changing \\\"Hatua! 🦶\\\" to something fun, then press Run!\",\"errorGeneric\":\"Oops! Something went wrong — the bridge is wobbling! 😰\",\"errorNoOutput\":\"You didn't take any steps! Press ▶ Run to walk across!\",\"errorTooMany\":\"Whoa, too many steps! 💥 The bridge is cracking!\",\"errorTooFew\":\"Almost there! You stopped in the middle! You need at least 5 steps!\",\"ex2\":{\"starterCode\":\"# Change the loop to take only 3 steps!\\n# Hint: change the number 5\\n\\nrudia (acha i = 0; i chini 5; i++) {\\n  andika(\\\"Hatua! 🦶\\\")\\n}\\n\",\"task\":\"Change the loop to repeat only 3 times!\",\"riddle\":\"🌉 Only 3 boards are safe! Change the number so you take exactly 3 steps!\",\"bridge\":\"You crossed the bridge! 🎉 But what if there were only 3 boards? Can you change the number?\",\"hint1\":\"Find the number 5 and change it to 3!\",\"hint2\":\"i chini 3 means \\\"i less than 3\\\" — the loop runs 3 times!\",\"errorNoRudia\":\"You need to use rudia to make a loop!\",\"errorNeedThree\":\"You need exactly 3 steps! Change the number in the loop!\"},\"ex3\":{\"starterCode\":\"# Print the step NUMBER each time!\\n# Fill in the blank:\\n\\nrudia (acha i = 1; i chini 6; i++) {\\n  andika(___)\\n}\\n\",\"task\":\"Print the step number each time the loop runs!\",\"riddle\":\"📝 Fill in the blank so each step shows its number: 1, 2, 3...\",\"bridge\":\"Now let's count the steps! Instead of saying the same thing each time, print the STEP NUMBER!\",\"hint1\":\"Replace ___ with the counter variable!\",\"hint2\":\"The variable i counts from 1 to 5 — just write i!\",\"hint3\":\"Try: andika(i) — it prints the number each time!\",\"errorNeedNumbers\":\"You need at least 3 lines of output with numbers!\",\"errorNoNumbers\":\"Your output should have numbers! Use the counter variable i!\"},\"ex4\":{\"starterCode\":\"# Write a loop that prints 4 animal sounds!\\n\\n\",\"task\":\"Write a loop from scratch that prints 4 times!\",\"riddle\":\"🚀 Write your own loop! Use rudia to print something 4 times!\",\"bridge\":\"You're a loop expert now! 🌟 Can you write one completely from scratch?\",\"hint1\":\"Start with: rudia (acha i = 0; i chini 4; i++) {\",\"hint2\":\"Inside the loop: andika(\\\"Simba anguruma!\\\")\",\"hint3\":\"Full example: rudia (acha i = 0; i chini 4; i++) {\\n  andika(\\\"Simba anguruma! 🦁\\\")\\n}\",\"errorNeedFour\":\"You need at least 4 lines of output! Check your loop number!\"},\"outro1\":\"You made it across! 🎉 The last board falls into the river behind you. The magic tree is right up the mountain! 🏔️\",\"outro2\":\"Well done! 🧙 One step at a time — that's the power of loops! 🔄 Kito will go with you to the top. Good luck, little coder!\",\"outro3\":\"UGH! 👾 You crossed my bridge?! Fine! But you can NEVER fix the magic tree! ...can you? 😰\"},\"ch5\":{\"title\":\"Make Your Own Spell!\",\"subtitle\":\"Create your own code recipe\",\"questHook\":\"The magic tree needs YOUR spell to get better! ✨🌳\",\"d1\":\"You're at the top of the mountain! ⛰️ The magic tree is here — but it looks really sad 😢. To fix it, you need to make your OWN special spell!\",\"d2\":\"Look how far you've come! 🐢 You learned to TALK (andika), REMEMBER (acha), CHOOSE (kama), and REPEAT (rudia). Now let's make a SPELL with \\\"kazi\\\"! It's like writing a recipe! 🧪\",\"d3\":\"\\\"kazi\\\" means \\\"recipe\\\". You give it a name, put magic words inside, and then you can use it anytime! Like this:\",\"d4\":\"See? You make the recipe with \\\"kazi ponyaMti()\\\" then you USE it by writing \\\"ponyaMti()\\\"! Fill in your own healing words and save the tree! 🌳\",\"starterCode\":\"# Make a healing spell for the tree!\\n# Fill in the magic words:\\n\\nkazi ponyaMti() {\\n  andika(\\\"___\\\")\\n}\\n\\n# Now use your spell!\\nponyaMti()\\n\",\"task\":\"Fill in the spell with your own healing words!\",\"riddle\":\"⛰️ The tree needs healing! Fill in your magic words inside the spell recipe!\",\"hint1\":\"Replace ___ with healing words like \\\"Mti, pona!\\\"\",\"hint2\":\"Try: andika(\\\"Mti, pona sasa!\\\")\",\"hint3\":\"Any words will work! Just type something between the quotes!\",\"errorGeneric\":\"Oops! The spell didn't work — try again! 🌳\",\"errorNoOutput\":\"Your spell was silent! Fill in the words inside andika(\\\"___\\\")\",\"ex2\":{\"starterCode\":\"# The spell works! Now call it TWICE!\\n# Add another ponyaMti() at the bottom!\\n\\nkazi ponyaMti() {\\n  andika(\\\"Mti, pona! 🌳\\\")\\n}\\n\\nponyaMti()\\n\",\"task\":\"Call the healing spell two times!\",\"riddle\":\"✨ One spell wasn't enough! Add another ponyaMti() to heal the tree twice!\",\"bridge\":\"The spell worked once! 🌟 But the tree needs MORE healing! Call the spell again!\",\"hint1\":\"Add another line at the bottom: ponyaMti()\",\"hint2\":\"You can call a kazi as many times as you want!\",\"errorNoKazi\":\"You need to use kazi to create a function!\",\"errorCallTwice\":\"The tree needs TWO heals! Add another ponyaMti() call!\"},\"ex3\":{\"starterCode\":\"# Write TWO different spells!\\n\\n\",\"task\":\"Create two different functions and call both!\",\"riddle\":\"🚀 Make TWO kazi recipes — one for the tree, one for the flowers!\",\"bridge\":\"You're a real spell-maker now! 🌟 Can you write TWO different spells from scratch?\",\"hint1\":\"First kazi: kazi ponyaMti() { andika(\\\"Mti, pona!\\\") }\",\"hint2\":\"Second kazi: kazi furahaUa() { andika(\\\"Ua, furahi!\\\") }\",\"hint3\":\"Don't forget to CALL both: ponyaMti() and furahaUa()\",\"errorNeedTwo\":\"You need at least TWO kazi functions!\",\"errorCallBoth\":\"Create two kazi and call BOTH of them!\"},\"ex4\":{\"starterCode\":\"# A greeting function with a name!\\n# Fill in the blanks:\\n\\nkazi salimia(jina) {\\n  andika(\\\"Habari, \\\" + ___ + \\\"!\\\")\\n}\\n\\nsalimia(\\\"___\\\")\\nsalimia(\\\"___\\\")\\n\",\"task\":\"Fill in the blanks to greet two different people!\",\"riddle\":\"📝 Make the greeting work! Fill in jina and two names!\",\"bridge\":\"Functions can take INPUT too! 🎁 Like a recipe that works with different ingredients!\",\"hint1\":\"The first blank should be: jina (the parameter name)\",\"hint2\":\"The last blanks should be names like \\\"Kito\\\" and \\\"Amani\\\"\",\"hint3\":\"Answer: andika(\\\"Habari, \\\" + jina + \\\"!\\\") then salimia(\\\"Kito\\\") and salimia(\\\"Amani\\\")\",\"errorCallWithNames\":\"Call salimia() with TWO different names!\"},\"outro1\":\"THE TREE IS GLOWING! 🌳✨💛 Golden light shoots up through the branches! Leaves pop out, flowers bloom, and all the stories and songs fly back to the village! 🌟🌟🌟\",\"outro2\":\"YOU DID IT! 🐢🎉 You made your OWN spell! You started by saying hello, and now you're a real coder! The magic tree is saved!\",\"outro3\":\"Wait... WHAT?! 👾 You fixed EVERYTHING?! ...Okay okay... maybe coding IS pretty cool. Can... can you teach me too? Pretty please? 🥺\",\"outro4\":\"And so the magic tree of Algoriti was saved! 🌟 But the adventure isn't over — there's a party to throw! 🎉\"},\"ch6\":{\"title\":\"The Celebration!\",\"subtitle\":\"Use what you've learned!\",\"questHook\":\"Let's welcome everyone to the party — with code! 🎉\",\"d1\":\"It's celebration time! 🎊 The magic tree is healthy again! The village chief says: \\\"Let's throw the biggest party EVER!\\\" And guess who's in charge of the welcome? YOU! 🎉\",\"d2\":\"ME TOO! 👾 I used to break stuff, but now I wanna help! Let me welcome the guests! Please please please! 🥺\",\"d3\":\"This is it — the grand finale! 🐢 Use \\\"acha\\\" to remember a guest's name, then use \\\"andika\\\" to say \\\"Karibu\\\" (Welcome)! You know how to do this!\",\"d4\":\"Remember \\\"acha\\\" from Chapter 2? And \\\"andika\\\" from Chapter 1? Now put them together! Use + to glue words! Like this:\",\"d5\":\"See? \\\"Karibu \\\" + mgeni + \\\"!\\\" sticks the words together! Change the name to welcome YOUR friends! 🎉\",\"starterCode\":\"# Welcome guests to the party! 🎉\\n# Change the name to welcome your friend:\\n\\nacha mgeni = \\\"Kito\\\"\\nandika(\\\"Karibu \\\" + mgeni + \\\"!\\\")\\n\\n# Try adding more guests below!\\n# acha mgeni2 = \\\"Shida\\\"\\n# andika(\\\"Karibu \\\" + mgeni2 + \\\"!\\\")\\n\",\"task\":\"Welcome your friends to the party!\",\"riddle\":\"🎉 Welcome someone to the party! Change the name and say \\\"Karibu\\\"!\",\"hint1\":\"Change \\\"Kito\\\" to any name you like!\",\"hint2\":\"Uncomment the lines below to welcome more friends!\",\"hint3\":\"Remove the # at the start of the last two lines to add Shida!\",\"errorGeneric\":\"Oops! The party's not ready yet! Try again! 🔄\",\"errorNoOutput\":\"Nobody heard the welcome! Press ▶ Run!\",\"errorNoKaribu\":\"Say \\\"Karibu\\\" (Welcome) to your guests! That's the magic party word!\",\"ex2\":{\"starterCode\":\"# Add a kama to check if the guest is special!\\n\\nacha mgeni = \\\"Kito\\\"\\nandika(\\\"Karibu \\\" + mgeni + \\\"!\\\")\\n\\n# Add: kama (mgeni ni \\\"Kito\\\") { andika(\\\"VIP!\\\") }\\n\",\"task\":\"Add a kama check: if the guest is Kito, say \\\"VIP!\\\"\",\"riddle\":\"⭐ Some guests are VIPs! Use kama to check who's special!\",\"bridge\":\"The party is starting! 🎉 But some guests are VIPs — let's give them a special welcome!\",\"hint1\":\"Add: kama (mgeni ni \\\"Kito\\\") { andika(\\\"VIP!\\\") }\",\"hint2\":\"Put the kama block after the andika welcome line!\",\"errorNeedTwo\":\"You need at least 2 lines of output — the welcome AND the VIP message!\"},\"ex3\":{\"starterCode\":\"# Use a loop to welcome 3 friends!\\n\\n\",\"task\":\"Write a loop that prints 3 welcome messages!\",\"riddle\":\"🚀 Use rudia to welcome 3 friends to the party!\",\"bridge\":\"Let's invite MORE friends! 🎉 Use a loop so we don't have to write the same thing 3 times!\",\"hint1\":\"Start with: rudia (acha i = 0; i chini 3; i++) {\",\"hint2\":\"Inside: andika(\\\"Karibu rafiki!\\\")\",\"hint3\":\"Full: rudia (acha i = 0; i chini 3; i++) {\\n  andika(\\\"Karibu rafiki \\\" + i + \\\"!\\\")\\n}\",\"errorNeedThree\":\"You need at least 3 welcome messages! Check your loop number!\"},\"ex4\":{\"starterCode\":\"# Write a welcome function and use it!\\n\\n\",\"task\":\"Create a karibu function and call it twice!\",\"riddle\":\"🚀 Make a kazi called karibu that prints a welcome, then call it!\",\"bridge\":\"For the grand finale — use EVERYTHING you've learned! 🌟 Make a function for the welcome!\",\"hint1\":\"Start with: kazi karibu() { andika(\\\"Karibu kwenye sherehe!\\\") }\",\"hint2\":\"Then call it: karibu() — call it twice for more fun!\",\"hint3\":\"Full: kazi karibu() {\\n  andika(\\\"Karibu kwenye sherehe! 🎉\\\")\\n}\\nkaribu()\\nkaribu()\",\"errorNeedFunction\":\"Create a kazi and call it at least twice!\"},\"outro1\":\"THE PARTY IS ON! 🎊🎉 Lights fill the sky! Music plays! Everyone cheers as they hear their name! The whole village dances! 💃🕺\",\"outro2\":\"This is the BEST day ever! 🐢 Look at everything you did: you opened gates, remembered names, chose paths, crossed bridges, made spells, and threw a PARTY! You are an INCREDIBLE coder! 🌟\",\"outro3\":\"I can't believe it! 👾 I started as a naughty bug who broke everything... and now I can CODE! Thank you for teaching me! You're my best friend! 🥹💚\",\"outro4\":\"And so the village of Algoriti lived happily in code! 🌟 The adventure never truly ends... because there's always something new to build! 🚀 THE END! 🎬✨\"},\"sceneGateLocked\":\"🔒 Shida's Lock\",\"sceneGateOpened\":\"🔓 Lock broken!\",\"sceneGuardWelcome\":\"✅ The elder lets you pass!\",\"sceneGuardSaved\":\"📜 Name saved — spirits know you!\",\"sceneGuardAsking\":\"🏠 Who are you, traveler?\",\"scenePathChosen\":\"🧭 Shida's signs defeated!\",\"scenePathChoose\":\"🔀 Shida scrambled the signs!\",\
