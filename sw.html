a. Ni mapendeleo tu.\"}},\"storageTitle\":\"Data Inahifadhiwa Wapi\",\"storageText\":\"Data yote imehifadhiwa kwenye localStorage ya browser yako — nafasi ndogo ya kuhifadhi kwenye kifaa CHAKO. Hatuioni, hatuwezi kuifikia, na haitoki kwenye compyuta au simu yako. Ukifuta data ya browser, itaondoka kabisa.\",\"ttsTitle\":\"Kipengele cha Kusoma kwa Sauti\",\"ttsText\":\"Ukiwasha kipengele cha \\\"kusoma kwa sauti\\\", maandishi ya story yanaweza kutumwa kwa huduma ya text-to-speech (Azure au sauti ya kifaa chako) ili kutengeneza audio. Ni maandishi ya story tu yanatumwa — kamwe habari za kibinafsi. Kipengele hiki ni hiari na kinaweza kuzimwa.\",\"dontTitle\":\"Tusichokifanya\",\"dontItems\":[\"Hatukusanyi anwani za email\",\"Hatuhitaji accounts au passwords\",\"Hatutumii cookies kwa tracking\",\"Hatuonyeshi matangazo\",\"Hatushiriki au kuuza data yoyote\",\"Hatutumii zana za analytics au tracking\"],\"childrenTitle\":\"Faragha ya Watoto (COPPA)\",\"childrenText\":\"JamboScript imetengenezwa kwa watoto wa miaka 8–14. Tunajali sana faragha ya watoto. Hatukusanyi habari yoyote ya kibinafsi kutoka kwa watoto. Data pekee iliyohifadhiwa iko kwenye kifaa cha mtoto na iko chini ya udhibiti wa wazazi.\",\"deleteTitle\":\"Futa Data Yote\",\"deleteText\":\"Kufuta data yote ya JamboScript kutoka kwenye kifaa chako, fungua developer tools za browser (F12) na run amri hii:\",\"disclaimerTitle\":\"Onyo\",\"disclaimerText\":\"JamboScript inatolewa \\\"kama ilivyo\\\" kwa madhumuni ya kielimu tu. Hatutoi dhamana kuhusu usahihi au ukamilifu wa maudhui. Hatuwajibiki kwa matatizo yanayotokana na matumizi ya jukwaa hili. Wazazi na walezi wanawajibika kusimamia matumizi ya watoto wao kwenye tovuti hii.\",\"contactTitle\":\"Maswali?\",\"contactText\":\"Ukiwa na maswali kuhusu faragha, wasiliana nasi kwa\",\"backButton\":\"Rudi kwa Ukurasa wa Wazazi\"},\"TopBar\":{\"map\":\"Map\",\"story\":\"Hadithi\",\"settings\":\"Mipangilio\",\"chapterOf\":\"Sura {number} / {total}\",\"muteSound\":\"Zima sauti na muziki\",\"enableSound\":\"Washa sauti na muziki\",\"muteNarration\":\"Simamisha kusoma\",\"enableNarration\":\"Soma kwa sauti\"},\"Editor\":{\"run\":\"Run\",\"running\":\"Ina-run...\",\"success\":\"✅ Imefanya!\",\"output\":\"Output\",\"outputError\":\"Output\",\"noOutput\":\"Hakuna output\",\"printToScreen\":\"Sema kitu\",\"condition\":\"Chagua (kama)\",\"loop\":\"Rudia (loop)\",\"functionSnippet\":\"Tengeneza recipe\"},\"Challenge\":{\"hints\":\"Hints\",\"hintLabel\":\"Hint {number}\",\"free\":\"(bure)\",\"congratulations\":\"🎉 Hongera! Umefanya!\"},\"Celebrations\":{\"congratulations\":\"Hongera!\",\"completed\":\"Umemaliza \\\"{title}\\\"\",\"nextChapter\":\"Sura Inayofuata →\",\"playAgain\":\"Cheza Tena\"},\"Speakers\":{\"kito\":\"Kito\",\"mzee_byte\":\"Mzee Byte\",\"shida\":\"Shida\",\"narrator\":\"Msimulizi\"},\"Scenes\":{\"gateLocked\":\"🔒 Mlango ya Kijiji\",\"gateOpened\":\"🔓 Mlango imefunguka!\",\"guardWelcome\":\"✅ Karibu!\",\"village\":\"🏠\",\"forest\":\"🌲\",\"bridge\":\"🌉\",\"mountain\":\"⛰️\",\"cave\":\"🕳️\",\"waterfall\":\"💧\",\"garden\":\"🌸\",\"market\":\"🏪\",\"library\":\"📚\",\"celebration\":\"🎉\"},\"LanguageSwitcher\":{\"label\":\"Language\"},\"Chapters\":{\"locale\":\"sw\",\"ch1\":{\"title\":\"Sema Maneno ya Magic!\",\"subtitle\":\"Ambia compyuta iseme kitu\",\"questHook\":\"Mti wa magic unaumwa! Saidia Kito kufungua mlango! 🚪\",\"d1\":\"Hapo zamani za kale, kulikuwa na kijiji kilichoitwa Algoriti. 🏘️ Kilikuwa na mti wa magic 🌳 uliohifadhi hadithi na nyimbo zote za kijiji. Lakini lo! Mdudu mdanganyifu anaitwa Shida anaumiza mti! 😱\",\"d2\":\"Sasa! Mimi ni Kito kobe! 🐢 Nahitaji msaada WAKO kuokoa mti wetu wa magic! Kwanza — ona mlango hii? Shida ameifunga! 🔒 Tunahitaji kuambia compyuta iseme maneno ya siri kuifungua!\",\"d2b\":\"Hehehe! 👾 Huwezi kuingia! Nimefunga mlango na kutupa ufunguo! Nyah nyah!\",\"d3\":\"Usijali! Najua njia! ✨ Chapa neno \\\"andika\\\" — ndivyo unavyoambia compyuta iSEME! Ni kama kusema \\\"Hey compyuta, sema hii!\\\" Jaribu:\",\"d4\":\"Unaona? andika(\\\"...\\\") inafanya compyuta iseme chochote kilicho ndani ya alama za kunukuu \\\"\\\"! Weka maneno ya magic na — BOOM! 💥 Lock inavunjika!\",\"starterCode\":\"# Sema maneno ya magic kufungua mlango!\\n# Bonyeza tu ▶ Run!\\n\\nandika(\\\"Fungua lango!\\\")\\n\",\"task\":\"Bonyeza ▶ Run kusema maneno ya magic!\",\"riddle\":\"🚪 Mlango imefungwa! Bonyeza ▶ Run kuambia compyuta iseme maneno ya magic!\",\"hint1\":\"Bonyeza tu kitufe cha ▶ Run!\",\"hint2\":\"Code iko tayari — andika(\\\"Fungua lango!\\\")\",\"hint3\":\"andika inamaanisha \\\"sema\\\" — inafanya compyuta iseme!\",\"errorGeneric\":\"Ooops! Kitu kimeenda vibaya — jaribu tena! 🔄\",\"errorNoOutput\":\"Mlango haikuskii! Bonyeza ▶ Run kusema kitu!\",\"ex2\":{\"starterCode\":\"# Sasa sema maneno YAKO mwenyewe ya magic!\\n# Badilisha ujumbe kuwa chochote unachotaka!\\n\\nandika(\\\"Fungua lango!\\\")\\n\",\"task\":\"Badilisha ujumbe kuwa maneno yako ya magic!\",\"riddle\":\"✏️ Kito anasema: \\\"Sasa fanya compyuta iseme maneno YAKO! Badilisha kilicho ndani ya alama za kunukuu \\\"\\\"!\\\"\",\"bridge\":\"Sawa! Umefungua mlango! 🎉 Lakini unaweza kufanya compyuta iseme maneno YAKO? Badilisha kilicho ndani ya alama za kunukuu \\\"\\\"!\",\"hint1\":\"Badilisha \\\"Fungua lango!\\\" kuwa kitu kingine, kama \\\"Habari!\\\"\",\"hint2\":\"Weka andika(...) lakini weka maneno YAKO kati ya \\\"\\\"!\",\"errorNoAndika\":\"Unahitaji kutumia andika() kufanya compyuta iseme!\",\"errorSameMessage\":\"Mwanzo mzuri! Lakini badilisha ujumbe — andika maneno YAKO!\",\"errorEmpty\":\"Usiache tupu! Andika kitu kati ya alama za kunukuu \\\"\\\"!\"},\"ex3\":{\"starterCode\":\"# Sema vitu VIWILI! Jaza sehemu tupu:\\n\\nandika(\\\"Habari!\\\")\\nandika(\\\"___\\\")\\n\",\"task\":\"Fanya compyuta iseme vitu VIWILI!\",\"riddle\":\"📝 Unaweza kufanya compyuta iseme vitu VIWILI? Jaza sehemu tupu kwenye mstari 4!\",\"bridge\":\"Umebadilisha ujumbe! 🌟 Sasa jaribu kufanya compyuta iseme vitu VIWILI — kama mazungumzo!\",\"hint1\":\"Badilisha ___ na maneno yoyote unayopenda!\",\"hint2\":\"Mfano: andika(\\\"Habari!\\\") kisha andika(\\\"Mambo vipi?\\\")\",\"errorNeedTwo\":\"Karibu! Unahitaji mistari MIWILI ya andika inayoprint!\"},\"ex4\":{\"starterCode\":\"# 🐛 Shida amevunja code! Unaweza kurekebisha?\\n# Kitu fulani hakipo...\\n\\nandika(Fungua lango!)\\n\",\"task\":\"🐛 Shida amevunja code! Tafuta na urekebishe hitilafu!\",\"riddle\":\"🐛 Shida amekula kitu kutoka kwenye code! Linganisha na ile Kito alikuonyesha — kitu gani hakipo?\",\"bridge\":\"Lo! 🐛 Shida amejiingiza na kula sehemu ya code! Unaweza kuona kitu gani kiko vibaya na kukirekebisha?\",\"hint1\":\"Linganisha code hii na ile inayofanya kazi hapo juu — nini tofauti?\",\"hint2\":\"Maneno yanahitaji kufungwa ndani ya alama za kunukuu \\\"hivi\\\"\",\"hint3\":\"Jaribu: andika(\\\"Fungua lango!\\\")\",\"errorNoQuotes\":\"Karibu! Maneno yanahitaji kuwa ndani ya alama za kunukuu: \\\"...\\\"\",\"hintQuotes\":\"💡 Maneno yanahitaji kuwa ndani ya alama za kunukuu — kama andika(\\\"Fungua lango!\\\")\"},\"outro1\":\"WUUUUSH! ✨ Mlango imefunguka! Mwanga wa dhahabu kila mahali! Wanakijiji wanatoka wakishangilia — mtu amekuja kuokoa mti! 🎉\",\"outro2\":\"Umefanya! 🐢 Umeambia compyuta nini iseme — hiyo ni spell yako ya KWANZA ya coding! Lakini Shida ana hila zaidi mbele. Twende! 🏃\"},\"ch2\":{\"title\":\"Jina Lako Nani?\",\"subtitle\":\"Fundisha compyuta kukumbuka vitu\",\"questHook\":\"Mzee kwenye mlango anataka kujua jina lako! 👴\",\"d1\":\"Umepita mlango! 🎉 Lakini subiri — kuna mzee anazuia njia. Anasema: \\\"Simama! Siruhusu wageni. Niambie jina lako kwanza!\\\" 👴\",\"d2\":\"Lo! Hatuachi tupite! 🐢 Tunahitaji kufundisha compyuta jina LAKO ili kila mtu ajue wewe ni nani!\",\"d3\":\"\\\"acha\\\" ni kama kuweka kitu ndani ya box na kuandika label! 📦 Unaweka jina lako ndani, hivi:\",\"d4\":\"\\\"acha jina = ...\\\" inamaanisha \\\"compyuta, kumbuka jina langu!\\\" Kisha \\\"andika(jina)\\\" inamaanisha \\\"sema kwa sauti!\\\" — mzee atasikia na atakuacha upite! 😊\",\"starterCode\":\"# Mzee anauliza: \\\"Jina lako nani?\\\"\\n# Weka jina lako kati ya quote marks:\\n\\nacha jina = \\\"Jina Lako\\\"\\n\\n# Sasa sema kwa sauti:\\nandika(jina)\\n\",\"task\":\"Andika jina lako kati ya alama za kunukuu \\\"\\\"!\",\"riddle\":\"🏠 Mzee anauliza: \\\"Wewe ni nani?\\\" — Andika jina lako kati ya \\\" \\\"!\",\"hint1\":\"Badilisha \\\"Jina Lako\\\" na jina lako halisi!\",\"hint2\":\"Hivi: acha jina = \\\"Amani\\\"\",\"hint3\":\"Hakikisha umeandika herufi angalau moja ndani ya \\\"\\\"\",\"errorGeneric\":\"Ooops! Kitu kimeenda vibaya — jaribu tena!\",\"errorNoName\":\"Umesahau jina lako! Andika ndani ya quote marks \\\"\\\"!\",\"ex2\":{\"starterCode\":\"# Sasa hifadhi UMRI wako pia!\\n# Jaza nambari ya umri wako:\\n\\nacha umri = ___\\nandika(umri)\\n\",\"task\":\"Hifadhi umri wako kwenye variable na uiprint!\",\"riddle\":\"📦 Weka umri wako kwenye box! Badilisha ___ na nambari!\",\"bridge\":\"Mzee anajua jina lako sasa! 🎉 Lakini anataka pia kujua umri wako. Hifadhi umri wako kwenye box!\",\"hint1\":\"Badilisha ___ na nambari kama 10\",\"hint2\":\"Jaribu: acha umri = 10\",\"errorNoAcha\":\"Unahitaji kutumia acha kutengeneza variable!\",\"errorNoUmri\":\"Weka NAMBARI (kama 10) baada ya umri = !\",\"errorNoOutput\":\"Sema umri wako kwa sauti! Ongeza andika(umri) mwishoni!\"},\"ex3\":{\"starterCode\":\"# Tengeneza boxes MBILI na useme zote!\\n\\n\",\"task\":\"Tengeneza variables mbili na uziprint zote!\",\"riddle\":\"🚀 Tengeneza boxes MBILI kwa acha na useme zote kwa andika! Peke yako!\",\"bridge\":\"Unazidi kuwa hodari! 🌟 Sasa jaribu kutengeneza variables MBILI peke yako!\",\"hint1\":\"Anza na: acha rangi = \\\"bluu\\\"\",\"hint2\":\"Kisha ongeza: acha nambari = 7 na andika(nambari)\",\"hint3\":\"Mfano kamili: acha rangi = \\\"bluu\\\"\\nandika(rangi)\\nacha nambari = 7\\nandika(nambari)\",\"errorNeedTwo\":\"Unahitaji angalau mistari MIWILI ya acha — boxes mbili!\",\"errorPrintBoth\":\"Usisahau kuandika zote mbili!\"},\"ex4\":{\"starterCode\":\"# 🐛 Shida ameharibu jina la variable!\\n# Mstari wa andika una typo!\\n\\nacha wanyama = \\\"simba\\\"\\nandika(wanayama)\\n\",\"task\":\"🐛 Shida amebadilisha herufi! Tafuta typo!\",\"riddle\":\"🐛 Angalia kwa makini mstari 5 — jina linaendana na label ya box?\",\"bridge\":\"Shida amerudi tena! 🐛 Amebadilisha herufi moja kwenye code. Unaweza kuiona?\",\"hint1\":\"Linganisha jina kwenye mstari 4 na 5 — ni sawa?\",\"hint2\":\"Mstari 4 unasema 'wanyama' lakini mstari 5 unasema 'wanayama' — ona tofauti!\",\"hint3\":\"Badilisha wanayama kuwa wanyama — 'y' na 'a' zimebadilishwa!\",\"hintSpelling\":\"💡 Angalia spelling — jina la variable lazima liwe SAWA kabisa!\"},\"outro1\":\"Mzee anatabasamu! \\\"Karibu, mdogo!\\\" 😊 Sasa kila mtu kijijini anajua jina lako! Unaweza kuendelea kuelekea mti wa magic! 🌳\",\"outro2\":\"Psst! 👾 Una jina sasa? Na nini? Nimeharibu alama zote msituni! Utapotea SANA! Hehehe!\",\"outro3\":\"Usimsikilize Shida! 🐢 Kitu kizuri ni — compyuta inakumbuka jina lako sasa! Hiyo inaitwa \\\"variable\\\" — ni kama label kwenye box. Muhimu sana! Tuendelee! 📦\"},\"ch3\":{\"title\":\"Chagua Njia Yako!\",\"subtitle\":\"Fundisha compyuta kuchagua\",\"questHook\":\"Shida ameharibu alama! Twende wapi? 🤔\",\"d1\":\"Uko msituni sasa! 🌲 Njia imegawanyika! Kushoto ni pango 🕳️, kulia ni mto 🏞️. Mvua inanyesha — ipi salama?\",\"d1b\":\"Hahaha! 👾 Nimebadilisha alama ZOTE! Bahati njema kupata njia! Mwahahaha!\",\"d2\":\"Usiogope! 😊 Mimi ni Mzee Byte, bundi mwenye hekima 🧙. Tunaweza kuangalia hali ya hewa na kuchagua njia sahihi!\",\"d3\":\"\\\"kama\\\" inamaanisha \\\"if\\\" — kama kuuliza swali! KAMA mvua → nenda pangoni! Rahisi! Angalia:\",\"d4\":\"Mvua inanyesha sasa! 🌧️ Jaza tu nini useme: \\\"Nenda pangoni!\\\" inamaanisha \\\"Go to the cave!\\\" Rahisi!\",\"starterCode\":\"# Mvua inanyesha! (hewa = \\\"mvua\\\")\\n# Ambia wote waende pangoni!\\n# Jaza tu maneno ndani ya andika:\\n\\nkama (hewa ni \\\"mvua\\\") {\\n  andika(\\\"___\\\")\\n}\\n\",\"task\":\"Jaza sehemu tupu — tuseme nini mvua inaponyesha?\",\"riddle\":\"🌧️ Mvua inanyesha! Jaza sehemu tupu: ambia wote waende wapi!\",\"hint1\":\"Badilisha ___ na maneno kama \\\"Nenda pangoni!\\\"\",\"hint2\":\"Jaribu: andika(\\\"Nenda pangoni!\\\")\",\"hint3\":\"Maneno yoyote yanafanya kazi! Andika tu kitu kati ya alama za kunukuu \\\"\\\"!\",\"errorGeneric\":\"Ooops! Kitu kimeenda vibaya — jaribu tena! 🔄\",\"errorNoOutput\":\"Sehemu ya kama haikusema kitu! Jaza sehemu tupu ndani ya andika(\\\"___\\\")\",\"ex2\":{\"starterCode\":\"# Nini kama HANYESHI? Ongeza \\\"la sivyo\\\" (otherwise)!\\n\\nkama (hewa ni \\\"mvua\\\") {\\n  andika(\\\"Nenda pangoni!\\\")\\n}\\n\",\"task\":\"Ongeza sehemu ya \\\"la sivyo\\\" kwa wakati ambao HANYESHI!\",\"riddle\":\"☀️ Tuseme nini kama jua linawaka? Ongeza la sivyo { ... } baada ya }\",\"bridge\":\"Umechagua njia sahihi! 🎉 Lakini nini kama hali ya hewa inabadilika? Tupange kwa zote!\",\"hint1\":\"Baada ya }, ongeza: la sivyo { andika(\\\"kitu\\\") }\",\"hint2\":\"la sivyo inamaanisha \\\"vinginevyo\\\" — ina-run kama kama ni uongo!\",\"errorNoKama\":\"Unahitaji kutumia kama kufanya uchaguzi!\",\"errorNoElse\":\"Ongeza la sivyo { ... } kushughulikia hali nyingine!\"},\"ex3\":{\"starterCode\":\"# Andika kama/la sivyo yako kutoka mwanzo!\\n# Tengeneza variable na uiangalie!\\n\\n\",\"task\":\"Andika kama/la sivyo yako kutoka mwanzo!\",\"riddle\":\"🚀 Tengeneza variable, kisha tumia kama kuiangalia! Ongeza la sivyo pia!\",\"bridge\":\"Sasa unajua kama NA la sivyo! 🌟 Unaweza kuandika moja peke yako?\",\"hint1\":\"Anza na: acha chakula = \\\"pilau\\\"\",\"hint2\":\"Kisha: kama (chakula ni \\\"pilau\\\") { andika(\\\"Tamu!\\\") }\",\"hint3\":\"Mfano kamili: acha chakula = \\\"pilau\\\"\\nkama (chakula ni \\\"pilau\\\") {\\n  andika(\\\"Tamu!\\\")\\n} la sivyo {\\n  andika(\\\"Sawa tu\\\")\\n}\"},\"ex4\":{\"starterCode\":\"# 🐛 Shida ameandika check mbaya!\\n# Mvua INANYESHA, lakini code inaangalia jua!\\n\\nkama (hewa ni \\\"jua\\\") {\\n  andika(\\\"Nenda pangoni!\\\")\\n}\\n\",\"task\":\"🐛 Condition iko vibaya! Mvua inanyesha lakini code inaangalia jua!\",\"riddle\":\"🐛 Angalia mstari 4 — hali ya hewa ni mvua lakini Shida ameandika jua!\",\"bridge\":\"Shida amebadilisha hali ya hewa! 🐛 Code inaonekana sawa lakini condition iko vibaya!\",\"hint1\":\"Hali ya hewa halisi ni nini? Ni mvua, si jua!\",\"hint2\":\"Badilisha \\\"jua\\\" kuwa \\\"mvua\\\" kwenye mstari 4\",\"hint3\":\"kama (hewa ni \\\"mvua\\\") — hiyo ndiyo jibu!\",\"errorWrongCondition\":\"Angalia condition yako — hali ya hewa ni mvua, si jua!\",\"hintWrongWeather\":\"💡 Hali ya hewa ni mvua — badilisha condition iangalie mvua!\"},\"outro1\":\"Njia sahihi inaangaza chini ya miguu yako! ✨ Alama za uwongo za Shida zinapotea kama mapovu! Msitu unafunguka na unaona... daraja kubwa la zamani! 🌉\",\"outro2\":\"Vizuri sana! 🧙 Umefundisha compyuta kuchagua — KAMA kitu ni kweli, FANYA kitu! Werevu sana! Lakini kuna zaidi mbele...\"},\"ch4\":{\"title\":\"Hatua kwa Hatua!\",\"subtitle\":\"Fanya compyuta irudie vitu\",\"questHook\":\"Shida amevunja daraja! Tembea kwa uangalifu — hatua 5! 🌉\",\"d1\":\"Umefika darajani! 🌉 Mti wa magic uko PALE PALE upande wa pili! Lakini... Shida ametafuna mbao! 😬 Mbao 5 tu zimebaki!\",\"d1b\":\"Nimetafuna mbao nyingi! 👾 Nom nom nom! HAKUNA njia ya kuvuka!\",\"d2\":\"Usipanike! 🧙 Tutatumia LOOP! Badala ya kuandika \\\"hatua\\\" mara tano... tuandike MARA MOJA na kusema \\\"fanya mara 5\\\"!\",\"d3\":\"\\\"rudia\\\" inamaanisha \\\"repeat\\\"! Inafanya kitu mara nyingi. Nambari inaambia mara ngapi! Angalia:\",\"d4\":\"Unaona nambari 5? Hiyo ni hatua ngapi tunapiga! Loop inasema \\\"fanya hii mara 5\\\" — bonyeza Run! Rahisi!\",\"starterCode\":\"# Vuka daraja!\\n# Loop inarudia mara 5 — hatua moja kila wakati!\\n# Bonyeza tu ▶ Run!\\n\\nrudia (acha i = 0; i chini 5; i++) {\\n  andika(\\\"Hatua! 🦶\\\")\\n}\\n\",\"task\":\"Bonyeza ▶ Run kuvuka daraja!\",\"riddle\":\"🌉 Daraja lina mbao 5! Bonyeza ▶ Run kupiga hatua 5 kuvuka!\",\"hint1\":\"Loop iko tayari! Bonyeza tu ▶ Run!\",\"hint2\":\"Nambari 5 inamaanisha inarudia mara 5 — hatua moja kwa ubao!\",\"hint3\":\"Jaribu kubadilisha \\\"Hatua! 🦶\\\" kwa kitu cha kufurahisha, kisha bonyeza Run!\",\"errorGeneric\":\"Ooops! Kitu kimeenda vibaya — daraja linatetemeka! 😰\",\"errorNoOutput\":\"Hukupiga hatua yoyote! Bonyeza ▶ Run kuvuka!\",\"errorTooMany\":\"Ee, hatua nyingi mno! 💥 Daraja linavunjika!\",\"errorTooFew\":\"Karibu umefika! Umesimama katikati! Unahitaji angalau hatua 5!\",\"ex2\":{\"starterCode\":\"# Badilisha loop ipige hatua 3 tu!\\n# Hint: badilisha nambari 5\\n\\nrudia (acha i = 0; i chini 5; i++) {\\n  andika(\\\"Hatua! 🦶\\\")\\n}\\n\",\"task\":\"Badilisha loop irudie mara 3 tu!\",\"riddle\":\"🌉 Mbao 3 tu ni salama! Badilisha nambari upige hatua 3 kamili!\",\"bridge\":\"Umevuka daraja! 🎉 Lakini nini kama kulikuwa na mbao 3 tu? Unaweza kubadilisha nambari?\",\"hint1\":\"Tafuta nambari 5 na uibadilishe kuwa 3!\",\"hint2\":\"i chini 3 inamaanisha \\\"i chini ya 3\\\" — loop ina-run mara 3!\",\"errorNoRudia\":\"Unahitaji kutumia rudia kutengeneza loop!\",\"errorNeedThree\":\"Unahitaji hatua 3 kamili! Badilisha nambari kwenye loop!\"},\"ex3\":{\"starterCode\":\"# Print NAMBARI ya hatua kila wakati!\\n# Jaza sehemu tupu:\\n\\nrudia (acha i = 1; i chini 6; i++) {\\n  andika(___)\\n}\\n\",\"task\":\"Print nambari ya hatua kila wakati loop ina-run!\",\"riddle\":\"📝 Jaza sehemu tupu ili kila hatua ionyeshe nambari yake: 1, 2, 3...\",\"bridge\":\"Sasa tuhesabu hatua! Badala ya kusema kitu sawa kila wakati, print NAMBARI YA HATUA!\",\"hint1\":\"Badilisha ___ na variable ya counter!\",\"hint2\":\"Variable i inahesabu kutoka 1 hadi 5 — andika tu i!\",\"hint3\":\"Jaribu: andika(i) — inaprint nambari kila wakati!\",\"errorNeedNumbers\":\"Unahitaji angalau mistari 3 ya output yenye nambari!\",\"errorNoNumbers\":\"Output yako inapaswa kuwa na nambari! Tumia variable ya counter i!\"},\"ex4\":{\"starterCode\":\"# Andika lo
